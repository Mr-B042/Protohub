# Dockerfile, not Nixpacks or Railpack (8 Nov 2026): both download their build
# tool from GitHub on every build, and those downloads kept failing (504), so
# no deploy could get through. Dockerfile.railway installs jemalloc too.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
startCommand = "sh ./start-railway.sh"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
